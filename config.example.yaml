# Tudget configuration
#
# Copy this file to config.yaml and fill in your real values.
# config.yaml is gitignored and must never be committed.

server:
  host: "0.0.0.0"
  port: 8000
  # Public URL that reaches this server (your ngrok URL). Used for the
  # Twilio webhook and for linking receipt photos into Notion.
  base_url: "https://your-subdomain.ngrok-free.app"

phone:
  # Your phone number in E.164 format. Incoming texts from any other
  # number are ignored.
  my_number: "+15555550123"

# Auth + routing for push notifications forwarded from your Android relay
# device (see README's "Android relay device" section).
notification:
  # Shared secret the device's notification-forwarder app sends in the
  # X-Tudget-Secret header. Generate any random string, e.g.:
  #   python -c "import secrets; print(secrets.token_hex(24))"
  shared_secret: "change-me-to-a-random-string"
  # Maps each bank app's Android package name to a parser key. Notifications
  # from apps not listed here are ignored. Adjust if your bank's app uses a
  # different package name (check the Play Store URL: play.google.com/store/
  # apps/details?id=<package_name>).
  apps:
    com.chase.sig.android: chase
    com.sofi.mobile: sofi
    com.fidelity.android: fidelity
    com.venmo: venmo

twilio:
  account_sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  auth_token: "your_twilio_auth_token"
  # The Twilio number that texts you and receives your replies.
  from_number: "+15555550100"

notion:
  api_key: "secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # Notion page under which the three databases (Categories, Transactions,
  # Budget Summary) are created automatically on first run. Open the page
  # in Notion and copy the 32-char ID from the URL.
  parent_page_id: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # Leave these blank — filled in automatically after first run.
  # Set them manually if you prefer to create the databases yourself.
  categories_db_id: ""
  transactions_db_id: ""
  budget_summary_db_id: ""
  # How often (seconds) to re-read the Categories DB for budget changes.
  category_refresh_interval_seconds: 3600

plaid:
  # Set enabled: true and fill in credentials to turn on the nightly
  # reconciliation safety net (catches purchases that notification parsing
  # missed). Disabled by default — the rest of Tudget works without it.
  enabled: false
  client_id: ""
  secret: ""
  environment: "sandbox" # sandbox | development | production
  # Hour (0-23, local server time) the nightly reconciliation job runs.
  reconciliation_hour: 2
  accounts: []
  # When enabled, add one entry per account:
  # accounts:
  #   - name: "Chase Credit"
  #     access_token: "access-sandbox-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  #     account_id: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

receipts:
  storage_dir: "data/receipts"
