# XcodeGen spec -- run `xcodegen generate` in this directory to produce
# Tudget.xcodeproj, then open it in Xcode.
#
# The project file is generated rather than committed so there's no 20,000-line
# pbxproj to merge-conflict over, and so the things you must personalise --
# your bundle identifier and Apple Developer team -- live in one readable place.

name: Tudget

options:
  bundleIdPrefix: com.adamodeven
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# ---------------------------------------------------------------------------
# The two lines you'd change to build this under a different account.
# The &TEAM anchor lets the target `attributes` blocks below reuse this same
# value, so it's still only set in one place.
# ---------------------------------------------------------------------------
settings:
  base:
    APP_BUNDLE_ID: com.adamodeven.tudget
    DEVELOPMENT_TEAM: &TEAM "2VT8NJTJY6"

    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES

# Core/ and Shared/ compile into every target that needs them, so parsing and
# budget maths can't drift between the app, the share sheet, and the widgets.
targetTemplates:
  SharedLogic:
    sources:
      - path: Tudget/Core
      - path: Tudget/Shared
      - path: Tudget/Models
      - path: Tudget/Intents

targets:

  # -------------------------------------------------------------------------
  # The app.
  # -------------------------------------------------------------------------
  Tudget:
    type: application
    platform: iOS
    # DEVELOPMENT_TEAM (the build setting, above) is what xcodebuild reads.
    # attributes.DevelopmentTeam is the separate PBXProject TargetAttributes
    # entry that Xcode's own Signing & Capabilities UI writes when you pick a
    # team from the dropdown -- without it, automatic signing can't resolve
    # and every `xcodegen generate` silently undoes a manual fix in Xcode.
    attributes:
      DevelopmentTeam: *TEAM
      ProvisioningStyle: Automatic
    sources:
      - path: Tudget
        excludes:
          - "Supporting/*.plist"
          - "Supporting/*.entitlements"
    settings:
      base:
        PRODUCT_NAME: Tudget
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Tudget/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tudget/Supporting/Tudget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TudgetShare
        embed: true
      - target: TudgetWidgets
        embed: true

  # -------------------------------------------------------------------------
  # Share extension: screenshot a bank alert -> Share -> Tudget.
  # -------------------------------------------------------------------------
  TudgetShare:
    type: app-extension
    platform: iOS
    attributes:
      DevelopmentTeam: *TEAM
      ProvisioningStyle: Automatic
    templates: [SharedLogic]
    sources:
      - path: TudgetShare
        excludes:
          - "*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: TudgetShare
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        INFOPLIST_FILE: TudgetShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: TudgetShare/TudgetShare.entitlements

  # -------------------------------------------------------------------------
  # Widget extension: Home/Lock Screen widgets and the Control Center control.
  # -------------------------------------------------------------------------
  TudgetWidgets:
    type: app-extension
    platform: iOS
    attributes:
      DevelopmentTeam: *TEAM
      ProvisioningStyle: Automatic
    templates: [SharedLogic]
    sources:
      - path: TudgetWidgets
        excludes:
          - "*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: TudgetWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        INFOPLIST_FILE: TudgetWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TudgetWidgets/TudgetWidgets.entitlements

  # -------------------------------------------------------------------------
  # Unit tests for the pure logic in Core/.
  # -------------------------------------------------------------------------
  TudgetTests:
    type: bundle.unit-test
    platform: iOS
    attributes:
      DevelopmentTeam: *TEAM
      ProvisioningStyle: Automatic
    sources:
      - path: TudgetTests
    dependencies:
      - target: Tudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tudget:
    build:
      targets:
        Tudget: all
        TudgetShare: all
        TudgetWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TudgetTests
    archive:
      config: Release
