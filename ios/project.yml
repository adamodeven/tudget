# XcodeGen spec -- run `xcodegen generate` in this directory to produce
# Tudget.xcodeproj, then open it in Xcode.
#
# The project file is generated rather than committed so there's no 20,000-line
# pbxproj to merge-conflict over, and so the one thing you must personalise --
# your bundle identifier and Apple Developer team -- lives in a single readable
# place. See ios/README.md.

name: Tudget

options:
  bundleIdPrefix: com.tudget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# ---------------------------------------------------------------------------
# CHANGE THESE TWO LINES (see ios/README.md, step 2)
# ---------------------------------------------------------------------------
#   APP_BUNDLE_ID must be globally unique on App Store Connect -- use your own
#   reverse-domain, e.g. com.adamodeven.tudget.
#   DEVELOPMENT_TEAM is your 10-character Apple Developer Team ID, from
#   https://developer.apple.com/account -> Membership details.
settings:
  base:
    APP_BUNDLE_ID: com.tudget.app
    DEVELOPMENT_TEAM: ""

    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO

targets:

  # The app itself.
  Tudget:
    type: application
    platform: iOS
    sources:
      - path: Tudget
        excludes:
          - "Supporting/*.plist"
          - "Supporting/*.entitlements"
    settings:
      base:
        PRODUCT_NAME: Tudget
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Tudget/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tudget/Supporting/Tudget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TudgetShare
        embed: true
        codeSign: true

  # Share-sheet extension: capture a purchase from a screenshot without
  # opening the app. It compiles the same Core/ and Shared/ sources as the app
  # so parsing behaviour can't drift between the two.
  TudgetShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TudgetShare
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Tudget/Core
      - path: Tudget/Shared
    settings:
      base:
        PRODUCT_NAME: Tudget
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        INFOPLIST_FILE: TudgetShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: TudgetShare/TudgetShare.entitlements

  # Unit tests for the pure logic: currency parsing, purchase extraction,
  # category matching, budget math.
  TudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TudgetTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tudget

schemes:
  Tudget:
    build:
      targets:
        Tudget: all
        TudgetShare: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TudgetTests
    archive:
      config: Release
