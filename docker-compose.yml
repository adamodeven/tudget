services:
  tudget:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    restart: unless-stopped

  # Optional: exposes the app at a public ngrok URL. Run with:
  #   docker compose --profile ngrok up
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["ngrok"]
    command: ["http", "tudget:8000"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040" # ngrok web UI: shows your public URL
    depends_on:
      - tudget
    restart: unless-stopped

  # Optional: keeps the tethered Android relay device's notification
  # forwarder app alive over USB via adb (whitelists it from battery
  # optimization, relaunches it if killed). Requires a USB data connection
  # between the device and this host. Run with:
  #   docker compose --profile android-watchdog up -d --build
  android-watchdog:
    build: ./watchdog
    profiles: ["android-watchdog"]
    privileged: true # needed for USB device passthrough (adb)
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./watchdog/android:/root/.android # persists the adb key pair across restarts
    environment:
      - FORWARDER_PACKAGE=${FORWARDER_PACKAGE:-com.arlosoft.macrodroid}
    restart: unless-stopped
